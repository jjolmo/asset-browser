<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="folderDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Folder back -->
  <path d="M48 120 L48 432 Q48 456 72 456 L440 456 Q464 456 464 432 L464 160 Q464 136 440 136 L240 136 L200 96 L88 96 Q48 96 48 120z" fill="url(#folderDark)"/>

  <!-- Folder front tab -->
  <path d="M48 120 Q48 96 88 96 L200 96 L240 136 L48 136z" fill="url(#folder)"/>

  <!-- Folder front face -->
  <path d="M40 176 Q40 160 64 160 L448 160 Q472 160 472 176 L472 440 Q472 464 448 464 L64 464 Q40 464 40 440z" fill="url(#folder)"/>

  <!-- Grid inside folder: 4 colorful tiles -->
  <!-- Tile 1: blue -->
  <rect x="80" y="200" width="160" height="104" rx="12" fill="#3b82f6"/>
  <path d="M100 280 l40-40 30 25 50-50 30 65z" fill="#1d4ed8" opacity="0.5"/>
  <circle cx="210" cy="225" r="14" fill="#93c5fd"/>

  <!-- Tile 2: purple -->
  <rect x="272" y="200" width="160" height="104" rx="12" fill="#8b5cf6"/>
  <rect x="310" y="230" width="44" height="44" rx="8" fill="#6d28d9" opacity="0.5" transform="rotate(45 332 252)"/>

  <!-- Tile 3: green -->
  <rect x="80" y="332" width="160" height="104" rx="12" fill="#22c55e"/>
  <circle cx="160" cy="384" r="32" fill="#15803d" opacity="0.5"/>

  <!-- Tile 4: pink/red -->
  <rect x="272" y="332" width="160" height="104" rx="12" fill="#f43f5e"/>
  <polygon points="352,348 372,390 352,410 332,390" fill="#be123c" opacity="0.5"/>

  <!-- Small magnifier accent -->
  <circle cx="430" cy="430" r="36" fill="white" opacity="0.95"/>
  <circle cx="422" cy="422" r="18" fill="none" stroke="#1e293b" stroke-width="5"/>
  <line x1="436" y1="436" x2="456" y2="456" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
</svg>
