[package]
name = "asset-browser"
version = "0.10.0"
edition = "2021"
description = "Recursive asset browser with smart folder organization"

[lib]
name = "asset_browser_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
rayon = "1.10"
ureq = "2"
